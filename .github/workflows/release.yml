name: 빌드 및 릴리스

# main 에 올릴 때마다: 테스트 + Windows 설치 파일 빌드(Actions 결과물로 보관)
#   └ server.py 의 VERSION 이 아직 릴리스되지 않은 새 버전이면(v{버전} 태그가 없으면)
#     GitHub Actions 가 태그와 릴리스를 직접 만들고 설치 파일을 첨부한다.
#     → 새 버전을 내려면 server.py 의 VERSION 만 올려서 main 에 병합하면 된다.
# v로 시작하는 태그(예: v1.0.0)를 직접 게시해도 같은 방식으로 릴리스에 파일이 첨부된다.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 검증 테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 검증 기준 자동 테스트
        run: python tests/test_core.py

  windows:
    name: Windows 설치 파일 빌드
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 정하기
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('server.py', encoding='utf-8').read()).group(1))")"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/^VERSION = \".*\"/VERSION = \"$V\"/" server.py
          echo "버전: $V"
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if ! EXISTING="$(git ls-remote --tags origin "refs/tags/v$V")"; then
              echo "태그 확인에 실패했습니다 (릴리스를 만들지 않고 중단)"; exit 1
            fi
            if [[ -z "$EXISTING" ]]; then
              RELEASE=true
              echo "v$V 태그가 아직 없으므로 이번 빌드로 릴리스를 만듭니다."
            else
              echo "v$V 는 이미 릴리스된 버전이므로 빌드·테스트만 합니다."
            fi
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: 검증 기준 자동 테스트 (Windows)
        env:
          PYTHONUTF8: "1"
        run: python tests/test_core.py

      - name: 빌드 도구 설치
        run: python -m pip install --upgrade pip pyinstaller anthropic

      - name: exe 만들기 (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/classmate.spec

      - name: exe 실행 확인 (자동 편성·엑셀·저장)
        env:
          PYTHONUTF8: "1"
        run: python packaging/smoke_test.py dist\ClassMate\ClassMate.exe

      - name: Inno Setup 준비
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup 을 찾을 수 없습니다" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=$env:VERSION" packaging\installer.iss'

      - name: 설치 → 자동 업데이트 → 재실행 실제 확인
        env:
          PYTHONUTF8: "1"
        run: python packaging/update_test.py dist\ClassMate-Setup-${{ env.VERSION }}.exe

      - name: 휴대용(설치 없이 쓰는) zip 만들기
        shell: pwsh
        run: |
          Copy-Item -Recurse samples dist\ClassMate\samples
          Copy-Item README.md dist\ClassMate\사용설명서.txt
          Compress-Archive -Path dist\ClassMate\* -DestinationPath "dist\ClassMate-Portable-$env:VERSION.zip"

      - name: 결과물 보관 (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ClassMate-${{ env.VERSION }}
          path: |
            dist/ClassMate-Setup-${{ env.VERSION }}.exe
            dist/ClassMate-Portable-${{ env.VERSION }}.zip

      - name: GitHub 릴리스 만들기 (태그·릴리스 생성, 설치 파일 첨부)
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: 학급 편성 도우미 ${{ env.VERSION }}
          body_path: packaging/release_notes.md
          generate_release_notes: true
          files: |
            dist/ClassMate-Setup-${{ env.VERSION }}.exe
            dist/ClassMate-Portable-${{ env.VERSION }}.zip
